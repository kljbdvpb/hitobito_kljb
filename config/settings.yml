# Settings relevant for the hitobito_kljb wagon
# Overrides settings from the main application
application:
  name: KLJB im Erzbistum Paderborn
  logo:
    image: logo.png
    width: 220
    height: 80
  languages:
    de: Deutsch
  footer:
    links:
      de:
        "Informationen und Hilfe": https://kljb-paderborn.de/zmv/
        "Datenschutz": https://kljb-paderborn.de/datenschutz/
# The person with this email has root access to everything
# This person should only be used by the operators of the application,
# not the customers.
# Initially, a password reset token may be mailed from the application
# to this address to set a password.
# Per RAILS_ROOT_USER_EMAIL ueberschreibbar (wie im Core-settings.yml).
root_email: <%= ENV['RAILS_ROOT_USER_EMAIL'].presence || 'datenschutz@kljb-paderborn.de' %>

impersonate:
  notify: false

# Automatisches Loeschen von Personen ohne Rolle (Nutzerentscheidung 2026-11-20:
# "Nach 3 Monaten ohne Rollen koennen Personen geloescht werden").
# Der Core-Job People::CleanupJob (taeglich) wertet FeatureGate "people.cleanup_job" aus
# (Settings.people.cleanup_job.enabled); Wagon-Settings ueberschreiben die Core-Werte
# (Core: enabled false, Fristen 1000 Monate). Zusaetzliche Absicherungen:
# Kljb::People::CleanupFinder. Ausschalten: enabled auf false (Rollback).
# Ereignis-Teilnahmen: Core-Default (120 Monate) bleibt, Personen mit juengeren Teilnahmen
# werden nur minimiert, nicht geloescht.
people:
  cleanup_job:
    enabled: true
  cleanup_cutoff_duration:
    regarding_roles: 3 # Monate seit Ende der letzten Rolle
    regarding_current_sign_in_at: 3 # Monate seit letztem Login

# Absenderdomain per RAILS_MAIL_DOMAIN ueberschreibbar (wie im Core-settings.yml),
# Fallback: post.kljb-paderborn.de.
# Anzeigename "KLJB" (Fachentscheidung; der frueher uebernommene Tippfehler "KLIB" ist korrigiert).
<% mail_domain = ENV['RAILS_MAIL_DOMAIN'].presence || 'post.kljb-paderborn.de' %>
email:
  sender: <%= "KLJB Mitgliederdatenbank <noreply@#{mail_domain}>" %>

currency:
  unit: EUR

phone_number:
  default_country: DE

countries:
  prioritized:
    - --
    - DE
    - AT
    - CH
    - LI
    - FR
    - IT

addresses:
  imported_countries:
    - DE

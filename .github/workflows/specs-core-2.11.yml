name: Specs gegen Core 2.11.5

# Eigener Lauf für den Portierungs-Branch. Das Upstream-Reusable-Workflow ist auf
# die Organisation hitobito/ festgelegt und wird hier nicht verwendet.
#
# Ablauf wie im Upstream-CI (hitobito/.github/workflows/wagon-tests.yml, Core 2.11.5):
# Der Core liegt neben dem Wagon (hitobito/ und hitobito_kljb/), wird über Wagonfile.ci
# eingebunden, die Specs laufen aber mit dem WAGON als Arbeitsverzeichnis.
# Das ist wichtig: Der Wagon-spec_helper setzt APP_ROOT (app_root.rb), bevor der
# Core-spec_helper geladen wird. Ohne APP_ROOT ruft spec/support/group/0_base.rb des
# Cores Group.reset_types! auf und ersetzt alle Wagon-Gruppen/-Rollen durch Testgruppen.
# Die Datenbank-Zugangsdaten sind reine CI-Testwerte für den Postgres-Dienst
# dieses Laufs, keine echten Zugangsdaten.

on:
  push:
    branches: [main, 'update/**', 'ci/**']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hitobito
          POSTGRES_PASSWORD: hitobito
          POSTGRES_DB: hitobito_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U hitobito"
          --health-interval 2s
          --health-timeout 10s
          --health-retries 10
    env:
      NO_COVERAGE: "true"
      SECRET_KEY_BASE: ci-only-not-a-secret
      RAILS_DB_ADAPTER: postgresql
      RAILS_DB_HOST: 127.0.0.1
      RAILS_DB_PORT: 5432
      RAILS_DB_USERNAME: hitobito
      RAILS_DB_PASSWORD: hitobito
      RAILS_DB_NAME: hitobito_test
      RAILS_TEST_DB_NAME: hitobito_test
      # Core config/environments/test.rb: maintain_test_schema = false, sonst laedt
      # ActiveRecord::Migration.maintain_test_schema! das Core-db/schema.rb neu und
      # verwirft die per wagon:migrate angelegten Spalten (members_normal/_discounted).
      DISABLE_TEST_SCHEMA_MAINTENANCE: "true"
    steps:
      - name: Wagon auschecken
        uses: actions/checkout@v6
        with:
          path: hitobito_kljb

      - name: Core 2.11.5 auschecken
        uses: actions/checkout@v6
        with:
          repository: hitobito/hitobito
          ref: 2.11.5
          path: hitobito
          fetch-depth: 1

      - name: Systempakete für pg-Gem
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Wagonfile für CI aktivieren
        working-directory: hitobito
        run: cp -v Wagonfile.ci Wagonfile

      - name: Ruby einrichten
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.13'
          bundler: '4.0.22'
          working-directory: hitobito

      - name: Gems installieren (Lockfile darf sich durch Wagonfile.ci ändern)
        working-directory: hitobito
        env:
          BUNDLE_FROZEN: "false"
        run: bundle install --jobs 4 --retry 3

      - name: Datenbank vorbereiten
        working-directory: hitobito
        env:
          RAILS_ENV: test
        run: |
          bundle exec rake db:create db:schema:load wagon:migrate

      - name: Diagnose Testumgebung (vor Specs)
        # Belegt Datenbank und Wagon-Spalten, bevor rspec startet. (Rollentypen lassen sich
        # hier nicht belegen: Group.reset_types! aus core spec/support/group/0_base.rb
        # laeuft erst unter rspec.)
        working-directory: hitobito
        env:
          RAILS_ENV: test
        run: |
          bundle exec rails runner 'puts "DB=#{ActiveRecord::Base.connection.current_database}"; puts "COLS=#{Group.column_names.grep(/members/).inspect}";'

      - name: Specs des Wagons ausführen
        # Wie Upstream: Arbeitsverzeichnis = Wagon, Gemfile = Core (Wagonfile.ci bindet den
        # Wagon ein). rspec findet ./spec/spec_helper.rb des Wagons über den Standard-Loadpath.
        working-directory: hitobito_kljb
        env:
          RAILS_ENV: test
          BUNDLE_GEMFILE: ${{ github.workspace }}/hitobito/Gemfile
        run: bundle exec rspec spec
